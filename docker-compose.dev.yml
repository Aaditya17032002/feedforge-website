# Local: http://localhost:3000
# docker compose -f docker-compose.dev.yml up --build
#
# Portal runs independently — no shared Docker network with Platform required.
# When Platform is up, backend is reached at host.docker.internal:8000 (published port)
# for contact/demo lead forms. Pricing on /pricing is static and does not call Platform.
#
# Runtime env: .env.local. For ${VAR} substitution:
#   docker compose --env-file .env.local -f docker-compose.dev.yml up --build

name: feedforge-portal

services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: feedforge_portal_dev
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
      - RUNNING_IN_DOCKER=true
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      # Reach Platform API via host port (no shared Docker network).
      - BACKEND_INTERNAL_URL=http://host.docker.internal:8000
      - LANDING_PORTAL_API_KEY=${LANDING_PORTAL_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - portal_node_modules:/app/node_modules

volumes:
  portal_node_modules:
