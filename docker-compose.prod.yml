# Production portal — internal only; public HTTP via Proxy stack on edge_net.
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Public URL (via edge proxy): http://<SERVER_IP>/
# Copy .env.prod.example → .env.prod and set LANDING_PORTAL_API_KEY (same as Application .env).

name: feedforge-portal

services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_CHATBOT_ENABLED: ${NEXT_PUBLIC_CHATBOT_ENABLED:-false}
    container_name: feedforge_portal
    restart: always
    env_file:
      - .env.prod
    networks:
      - edge_net

networks:
  edge_net:
    external: true
    name: edge_net
