# Production portal — pulls pre-built image from Docker Hub (built by GitHub Actions).
# Canonical CI/server file is docker-compose.cicd.yml. This file stays for leftover
# VPS commands; image vars match cicd so it does not pull the old :latest tag.
# Public HTTP via Proxy stack on edge_net.
#
# Prefer:
#   export DOCKERHUB_NAMESPACE=feedforgellc IMAGE_TAG=prod
#   bash scripts/server/deploy-from-hub.sh
#
# DOCKERHUB_NAMESPACE is required and must be feedforgellc.
# Copy .env.prod.example → .env.prod and set LANDING_PORTAL_API_KEY (same as Application .env).

name: feedforge-portal

services:
  portal:
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/feedforge-website:${IMAGE_TAG:-prod}
    container_name: feedforge_portal
    restart: always
    env_file:
      - .env.prod
    networks:
      - edge_net

networks:
  edge_net:
    external: true
    name: edge_net
