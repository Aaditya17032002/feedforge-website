# Server: http://<SERVER_IP>:3002 (avoids collision with Platform on host :80)
#
# Recommended:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Runtime env is loaded from .env.prod (env_file below). Compose variable
# substitution (${...}) also uses the file passed with --env-file, not .env.
#
# Set APP_URL=http://<SERVER_IP>:3002 (and other vars) in .env.prod before first run.

name: feedforge-portal

services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_CHATBOT_ENABLED: ${NEXT_PUBLIC_CHATBOT_ENABLED:-false}
    container_name: feedforge_portal
    restart: always
    ports:
      - "3002:3000"
    env_file:
      - .env.prod
