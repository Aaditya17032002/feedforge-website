# Production portal — pulls pre-built image from Docker Hub (built by GitHub Actions).
# Public HTTP via Proxy stack on edge_net.
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml pull
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# Public URL (via edge proxy): http://<SERVER_IP>/
# Copy .env.prod.example → .env.prod and set LANDING_PORTAL_API_KEY (same as Application .env).

name: feedforge-portal

services:
  portal:
    image: sonishivam1402/feedforge-website:latest
    container_name: feedforge_portal
    restart: always
    env_file:
      - .env.prod
    networks:
      - edge_net

networks:
  edge_net:
    external: true
    name: edge_net
