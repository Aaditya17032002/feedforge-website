name: Build, push, deploy

# Push to `dev` or `prod` → checks + Docker Hub image + SSH pull-only deploy.
# Image tags (same Hub repo, different tags — not separate repos):
#   dev  → namespace/feedforge-website:dev  and :dev-<sha>
#   prod → namespace/feedforge-website:prod and :prod-<sha>
# Namespace: organization variable DOCKERHUB_NAMESPACE.
# Required value: feedforgellc. No personal Docker Hub namespace fallback is allowed.

on:
  push:
    branches:
      - dev
      - prod
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Hub tag to build/deploy (dev or prod). Empty = infer from branch."
        required: false
        default: ""
      force_all:
        description: "Force rebuild image"
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY: docker.io

jobs:
  channel:
    name: Resolve channel
    runs-on: ubuntu-latest
    outputs:
      namespace: ${{ steps.s.outputs.namespace }}
      image_tag: ${{ steps.s.outputs.image_tag }}
      is_prod: ${{ steps.s.outputs.is_prod }}
    steps:
      - name: Resolve namespace and image tag
        id: s
        run: |
          NS="${{ vars.DOCKERHUB_NAMESPACE }}"
          if [ -z "$NS" ]; then
            echo "DOCKERHUB_NAMESPACE organization variable is required." >&2
            exit 1
          fi
          if [ "$NS" != "feedforgellc" ]; then
            echo "DOCKERHUB_NAMESPACE must be 'feedforgellc'; got '$NS'." >&2
            exit 1
          fi
          echo "namespace=${NS}" >> "$GITHUB_OUTPUT"

          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            if [ "${GITHUB_REF_NAME}" = "prod" ]; then
              TAG=prod
            else
              TAG=dev
            fi
          fi
          case "$TAG" in
            prod|dev) ;;
            *)
              echo "Unsupported image tag '$TAG' (use dev or prod)" >&2
              exit 1
              ;;
          esac
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ "$TAG" = "prod" ]; then
            echo "is_prod=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prod=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Using ${NS}/feedforge-website:${TAG}"

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.filter.outputs.website }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            website:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - 'public/**'
              - 'Dockerfile'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.js'
              - 'docker-compose.cicd.yml'
            deploy:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - 'public/**'
              - 'Dockerfile'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.js'
              - 'docker-compose.cicd.yml'
              - 'scripts/server/**'
              - '.github/workflows/**'

  checks:
    name: Light checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          # compose references env_file: .env.prod; CI checkout has no server secrets file.
          touch .env.prod
          export DOCKERHUB_NAMESPACE="feedforgellc"
          docker compose -f docker-compose.cicd.yml config >/dev/null
      - name: Package lock present
        run: test -f package.json && test -f package-lock.json

  build:
    name: Build & push website
    needs: [channel, changes, checks]
    # Do not reference bare `inputs.*` on push — Unrecognized named-value.
    if: |
      always() &&
      needs.checks.result == 'success' &&
      needs.changes.result == 'success' &&
      needs.channel.result == 'success' &&
      (
        needs.changes.outputs.website == 'true' ||
        github.event_name == 'workflow_dispatch' && github.event.inputs.force_all == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Short SHA
        id: meta
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push website (Next production target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ needs.channel.outputs.namespace }}/feedforge-website:${{ needs.channel.outputs.image_tag }}
            ${{ needs.channel.outputs.namespace }}/feedforge-website:${{ needs.channel.outputs.image_tag }}-${{ steps.meta.outputs.short }}
          build-args: |
            NEXT_PUBLIC_CHATBOT_ENABLED=${{ vars.NEXT_PUBLIC_CHATBOT_ENABLED || 'false' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://app.feedforge.ai' }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || '' }}
          cache-from: type=registry,ref=${{ needs.channel.outputs.namespace }}/feedforge-website:buildcache
          cache-to: type=registry,ref=${{ needs.channel.outputs.namespace }}/feedforge-website:buildcache,mode=max
          provenance: false

  deploy:
    name: Deploy to server
    needs: [channel, changes, checks, build]
    if: |
      always() &&
      !cancelled() &&
      needs.checks.result == 'success' &&
      needs.changes.result == 'success' &&
      needs.channel.result == 'success' &&
      (needs.changes.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST_PROD: ${{ secrets.DEPLOY_HOST_PROD }}
    steps:
      - name: Skip notice when prod SSH secrets are missing
        if: needs.channel.outputs.is_prod == 'true' && env.DEPLOY_HOST_PROD == ''
        run: |
          echo "Image tagged :prod. DEPLOY_HOST_PROD is not set — skipping SSH."
          echo "Add DEPLOY_HOST_PROD, DEPLOY_USER_PROD, DEPLOY_SSH_KEY_PROD when the prod server is ready."

      - name: Deploy over SSH
        if: needs.channel.outputs.is_prod != 'true' || env.DEPLOY_HOST_PROD != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ needs.channel.outputs.is_prod == 'true' && secrets.DEPLOY_HOST_PROD || secrets.DEPLOY_HOST }}
          username: ${{ needs.channel.outputs.is_prod == 'true' && secrets.DEPLOY_USER_PROD || secrets.DEPLOY_USER }}
          key: ${{ needs.channel.outputs.is_prod == 'true' && secrets.DEPLOY_SSH_KEY_PROD || secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/feedforge/website
            export DOCKERHUB_NAMESPACE=${{ needs.channel.outputs.namespace }}
            export IMAGE_TAG=${{ needs.channel.outputs.image_tag }}
            # Do not export DOCKERHUB_TOKEN (write) onto the server.
            # Server should already be docker-logged-in with a read-only pull token.
            chmod +x scripts/server/deploy-from-hub.sh || true
            # Strip Windows CRLF if present (breaks `set -o pipefail` on Linux).
            sed -i 's/\r$//' scripts/server/deploy-from-hub.sh || true
            bash scripts/server/deploy-from-hub.sh
